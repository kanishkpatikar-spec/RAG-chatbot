<style>
        /* Pulse Animation for typing indicator */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: theme('colors.primary');
            border-radius: 50%;
            margin: 0 2px;
            animation: pulse-ring 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        /* Markdown Styles */
        .prose strong { color: theme('colors.primary'); font-weight: 600; }
        .prose a { color: theme('colors.primary-fixed-dim'); text-decoration: underline; }
        .prose p { margin-bottom: 0.5em; }
        .prose p:last-child { margin-bottom: 0; }
        
        /* Custom Scrollbar for chat area */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: theme('colors.surface-variant'); border-radius: theme('borderRadius.full'); }
        ::-webkit-scrollbar-thumb:hover { background: theme('colors.outline'); }
    </style>

<!-- JavaScript Logic -->
<script>
        const chatContainer = document.getElementById('chat-history');
        const welcomePanel = document.getElementById('welcome-panel');
        const inputField = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        let isFirstMessage = true;

        // Ensure chat history is empty on load
        chatContainer.innerHTML = '';

        function fillAndSubmit(text) {
            inputField.value = text;
            submitMessage();
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                submitMessage();
            }
        }

        function createMessageElement(text, isUser = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'} mb-md`;

            const bubble = document.createElement('div');
            // Design System: User = #1f2937 (surface-container-high approx), Assistant = #111827 border #374151
            if (isUser) {
                bubble.className = "max-w-[85%] md:max-w-[75%] p-4 rounded-2xl rounded-tr-none bg-[#1f2937] text-[#f9fafb] font-body-lg text-body-lg shadow-sm";
                bubble.textContent = text;
            } else {
                bubble.className = "max-w-[85%] md:max-w-[75%] p-4 rounded-2xl rounded-tl-none bg-[#111827] border border-[#374151] text-[#f9fafb] font-body-lg text-body-lg shadow-sm prose prose-invert";
                
                // Basic Markdown parsing for bold and links
                let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                formattedText = formattedText.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                
                bubble.innerHTML = formattedText;
            }

            // Add avatar for assistant
            if (!isUser) {
                const avatarDiv = document.createElement('div');
                avatarDiv.className = "w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center mr-3 mt-1 shrink-0 border border-primary/30";
                avatarDiv.innerHTML = '<span class="material-symbols-outlined text-[18px] text-primary">robot_2</span>';
                
                const contentWrapper = document.createElement('div');
                contentWrapper.className = "flex items-start max-w-full";
                contentWrapper.appendChild(avatarDiv);
                contentWrapper.appendChild(bubble);
                wrapper.appendChild(contentWrapper);
            } else {
                wrapper.appendChild(bubble);
            }

            return wrapper;
        }

        function createTypingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.className = "flex w-full justify-start mb-md"
            wrapper.id = "typing-indicator";
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = "w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center mr-3 shrink-0 border border-primary/30";
            avatarDiv.innerHTML = '<span class="material-symbols-outlined text-[18px] text-primary">robot_2</span>';

            const bubble = document.createElement('div');
            bubble.className = "p-4 rounded-2xl rounded-tl-none bg-[#111827] border border-[#374151] flex items-center";
            bubble.innerHTML = `
                <div class="typing-indicator flex items-center">
                    <span></span><span></span><span></span>
                </div>
            `;
            
            const contentWrapper = document.createElement('div');
            contentWrapper.className = "flex items-start max-w-full";
            contentWrapper.appendChild(avatarDiv);
            contentWrapper.appendChild(bubble);
            wrapper.appendChild(contentWrapper);

            return wrapper;
        }

        async function submitMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            // UI State updates
            if (isFirstMessage) {
                welcomePanel.style.opacity = '0';
                setTimeout(() => {
                    welcomePanel.classList.add('hidden');
                    chatContainer.classList.remove('hidden');
                    chatContainer.classList.add('flex');
                }, 300);
                isFirstMessage = false;
            }

            // Append User Message
            const userEl = createMessageElement(text, true);
            chatContainer.appendChild(userEl);
            inputField.value = '';
            inputField.disabled = true;
            sendButton.disabled = true;
            sendButton.classList.add('opacity-50');
            scrollToBottom();

            // Append Typing Indicator
            const typingEl = createTypingIndicator();
            chatContainer.appendChild(typingEl);
            scrollToBottom();

            try {
                const response = await fetch('http://localhost:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // Remove typing indicator
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();

                // Append Assistant Message
                // Fallback text if API format differs, assuming data.reply or similar
                const replyText = data.reply || data.response || data.message || "**Success:** Connection established, but response format unhandled. Example text.";
                const botEl = createMessageElement(replyText, false);
                chatContainer.appendChild(botEl);

            } catch (error) {
                console.error("Fetch Error:", error);
                
                // Remove typing indicator
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();

                // Fallback for demo/dev purposes
                const errorMsg = "Sorry, I am having trouble connecting to the server. Please try again later. *(Ensure localhost:8000 is running)*";
                const botEl = createMessageElement(errorMsg, false);
                chatContainer.appendChild(botEl);
            } finally {
                inputField.disabled = false;
                sendButton.disabled = false;
                sendButton.classList.remove('opacity-50');
                inputField.focus();
                scrollToBottom();
            }
        }

        function scrollToBottom() {
            const mainContainer = document.querySelector('main');
            mainContainer.scrollTo({
                top: mainContainer.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
