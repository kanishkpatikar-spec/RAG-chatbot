# ---------------------------------------------------------------
# Phase 8 — Scheduled Data Ingestion via GitHub Actions
# ---------------------------------------------------------------
# Runs the full data-ingestion pipeline (scrape → parse → embed)
# on a daily cron schedule so the knowledge base stays fresh.
#
# To change the schedule, edit the cron expression below.
# Syntax: minute hour day-of-month month day-of-week  (UTC)
# ---------------------------------------------------------------

name: Scheduled Data Ingestion

on:
  schedule:
    # Runs every day at 10:30 AM IST (05:00 UTC)
    - cron: "0 5 * * *"

  # Allow manual trigger from the GitHub UI (Actions → Run workflow)
  workflow_dispatch:

permissions:
  contents: write   # needed if you ever commit updated vectorstore back

jobs:
  ingest:
    name: Scrape → Parse → Embed
    runs-on: ubuntu-latest

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Python Setup ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # ---- Cache HuggingFace Model ----
      # The BAAI/bge-small-en-v1.5 model (~130 MB) is cached between runs
      # so the embedding step doesn't re-download it every time,
      # avoiding HuggingFace 429 rate-limit errors.
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-bge-small-en-v1.5-${{ runner.os }}
          restore-keys: |
            hf-bge-small-en-v1.5-

      # ---- Run Pipeline ----
      - name: Run data-ingestion pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/scheduler.py

      # ---- Upload Artifacts (optional) ----
      - name: Upload vectorstore as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vectorstore-${{ github.run_id }}
          path: vectorstore/
          retention-days: 7

      # ---- Commit and Push Updated Data ----
      - name: Commit and push changes
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ vectorstore/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update knowledge base" && git push)
